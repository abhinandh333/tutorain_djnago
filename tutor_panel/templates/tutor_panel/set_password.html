<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Set Password | Tutorain</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            font-family: Arial, sans-serif;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
            color: #4f46e5;
            text-align: center;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 24px;
            text-align: center;
            color: #1e293b;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
            margin-bottom: 18px;
        }

        input:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }

        button {
            width: 100%;
            padding: 14px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
        }

        .success {
            display: block !important;
            background: #dcfce7;
            color: #166534;
        }

        .error {
            display: block !important;
            background: #fee2e2;
            color: #991b1b;
        }

        .footer {
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
            margin-top: 25px;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="logo">Tutorain</div>

    <h1>Set Your Password</h1>

    <p class="description">
        Welcome to Tutorain! Create a secure password to complete
        your account setup.
    </p>

    <form id="passwordForm">
        {% csrf_token %}

        <label for="password">New Password</label>
        <input
            type="password"
            id="password"
            placeholder="Enter your new password"
            minlength="6"
            autocomplete="new-password"
            required
        >

        <label for="confirmPassword">Confirm Password</label>
        <input
            type="password"
            id="confirmPassword"
            placeholder="Re-enter your password"
            minlength="6"
            autocomplete="new-password"
            required
        >

        <button type="submit" id="submitButton">
            Set Password
        </button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>

    <div class="footer">
        © Tutorain — Your Learning Partner
    </div>

</div>

<script type="module">
    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
        getAuth,
        verifyPasswordResetCode,
        confirmPasswordReset,
        signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBxS0njbmTZwtjBfsKyqL3YSnpjUAmjK0A",
        authDomain: "tutorain-tutor-portal.firebaseapp.com",
        projectId: "tutorain-tutor-portal",
        storageBucket: "tutorain-tutor-portal.firebasestorage.app",
        messagingSenderId: "294466526120",
        appId: "1:294466526120:web:ce1ddfc92fed0365845b9d",
        measurementId: "G-TBLP265GVX"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const params = new URLSearchParams(window.location.search);
    const mode = params.get("mode");
    const actionCode = params.get("oobCode");

    const form = document.getElementById("passwordForm");
    const button = document.getElementById("submitButton");
    const message = document.getElementById("message");

    let tutorEmail = null;
    let codeVerified = false;

    function showMessage(text, type) {
        message.textContent = text;
        message.className = type;
    }

    // Verify that the password setup link is valid.
    async function verifySetupLink() {
        if (mode !== "resetPassword" || !actionCode) {
            form.hidden = true;

            showMessage(
                "This password setup link is invalid. Please ask the Tutorain administrator for a new link.",
                "error"
            );

            return;
        }

        try {
            tutorEmail = await verifyPasswordResetCode(auth, actionCode);
            codeVerified = true;
        } catch (error) {
            form.hidden = true;

            showMessage(
                "This link is invalid or has expired. Please request a new password setup link.",
                "error"
            );
        }
    }

    await verifySetupLink();

    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        if (!codeVerified || !actionCode) {
            showMessage("Please open a valid password setup link.", "error");
            return;
        }

        const password = document.getElementById("password").value;
        const confirmPassword =
            document.getElementById("confirmPassword").value;

        if (password.length < 6) {
            showMessage(
                "Your password must contain at least 6 characters.",
                "error"
            );
            return;
        }

        if (password !== confirmPassword) {
            showMessage("The passwords do not match.", "error");
            return;
        }

        button.disabled = true;
        button.textContent = "Setting Password...";

        try {
            // Set the password through Firebase Authentication.
            await confirmPasswordReset(auth, actionCode, password);

            // Sign in to verify the account and obtain an ID token.
            const credential = await signInWithEmailAndPassword(
                auth,
                tutorEmail,
                password
            );

            const idToken = await credential.user.getIdToken();

            // Notify Django so it can record completion in Firestore.
            const response = await fetch(
                "{% url 'tutor_panel:password_setup_complete' %}",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": document.querySelector(
                            "[name=csrfmiddlewaretoken]"
                        ).value
                    },
                    body: JSON.stringify({
                        idToken: idToken
                    })
                }
            );

            const result = await response.json();

            if (!response.ok || !result.success) {
                throw new Error(
                    result.error ||
                    "Your password was set, but we could not update your account status. Please contact the administrator."
                );
            }

            form.hidden = true;

            showMessage(
                "Your password has been set successfully! The Tutorain administrator can now review your account.",
                "success"
            );

        } catch (error) {
            showMessage(
                error.message ||
                "Something went wrong. Please try again or request a new link.",
                "error"
            );

        } finally {
            button.disabled = false;
            button.textContent = "Set Password";
        }
    });
</script>

</body>
</html>
