<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tutorain | Tutor Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f6fc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 38px;
            border-radius: 18px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
            font-size: 14px;
        }

        h2 {
            color: #1e293b;
            margin-bottom: 8px;
        }

        .description {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .error-message {
            display: none;
            color: #b91c1c;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 18px;
            font-size: 13px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .pending-section {
            display: none;
            margin-bottom: 20px;
            padding: 16px;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 10px;
        }

        .pending-description {
            font-size: 13px;
            color: #475569;
            margin-bottom: 12px;
            line-height: 1.6;
        }

        .notify-button {
            background: #059669;
            font-size: 14px;
        }

        .notify-button:hover {
            background: #047857;
        }

        .notification-message {
            display: none;
            font-size: 13px;
            margin-top: 10px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            color: #94a3b8;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">Tutorain</div>

        <div class="subtitle">Tutor Management Portal</div>

        <h2>Welcome back!</h2>

        <p class="description">
            Sign in to access your students and classes.
        </p>

        <!-- Login error -->
        <div
            id="errorMessage"
            class="error-message"
            role="alert"
        ></div>

        <!-- Pending approval notification -->
        <div id="pendingApprovalSection" class="pending-section">

            <p class="pending-description">
                Your account is waiting for administrator approval.
                Click below to notify the Tutorain administrator.
            </p>

            <button
                type="button"
                id="notifyAdminButton"
                class="notify-button"
            >
                Notify Admin — I'm Waiting
            </button>

            <p
                id="notificationMessage"
                class="notification-message"
                role="status"
            ></p>

        </div>

        <!-- Login form -->
        <form id="loginForm">

            {% csrf_token %}

            <label for="email">Email address</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email address"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button type="submit" id="loginButton">
                Sign In
            </button>

        </form>

        <div class="footer">
            &copy; 2026 Tutorain. All rights reserved.
        </div>

    </div>

    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

        import {
            getAuth,
            signInWithEmailAndPassword
        } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";


        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBxS0njbmTZwtjBfsKyqL3YSnpjUAmjK0A",
            authDomain: "tutorain-tutor-portal.firebaseapp.com",
            projectId: "tutorain-tutor-portal",
            storageBucket: "tutorain-tutor-portal.firebasestorage.app",
            messagingSenderId: "294466526120",
            appId: "1:294466526120:web:ce1ddfc92fed0365845b9d",
            measurementId: "G-TBLP265GVX"
        };


        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);


        // Read Django CSRF cookie
        function getCookie(name) {

            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);

            if (parts.length === 2) {
                return parts.pop().split(";").shift();
            }

            return "";
        }


        // Display an error
        function showError(message) {

            const errorBox = document.getElementById("errorMessage");

            errorBox.textContent = message;
            errorBox.style.display = "block";
        }


        // Display pending approval notification button
        function showPendingApproval() {

            document.getElementById(
                "pendingApprovalSection"
            ).style.display = "block";
        }


        // Send approval notification email request to Django
        document.getElementById("notifyAdminButton").addEventListener(
            "click",
            async function() {

                const button = this;

                const message = document.getElementById(
                    "notificationMessage"
                );

                message.style.display = "none";

                button.disabled = true;
                button.textContent = "Sending email...";

                try {

                    // Tutor must already have authenticated with Firebase
                    const currentUser = auth.currentUser;

                    if (!currentUser) {
                        throw new Error(
                            "Please sign in again before notifying the administrator."
                        );
                    }

                    // Get authenticated Firebase ID token
                    const idToken = await currentUser.getIdToken();

                    // Get Django CSRF token
                    const csrfToken =
                        getCookie("csrftoken") ||
                        document.querySelector(
                            'input[name="csrfmiddlewaretoken"]'
                        )?.value ||
                        "";

                    if (!csrfToken) {
                        throw new Error(
                            "Security token is missing. Please refresh the page."
                        );
                    }

                    // Send notification request to Django
                    const response = await fetch(
                        "/tutor_panel/notify-admin/",
                        {
                            method: "POST",

                            credentials: "same-origin",

                            headers: {
                                "Content-Type": "application/json",
                                "X-CSRFToken": csrfToken
                            },

                            body: JSON.stringify({
                                idToken: idToken
                            })
                        }
                    );

                    const data = await response.json();

                    if (!response.ok || !data.success) {
                        throw new Error(
                            data.error || "Could not send notification."
                        );
                    }

                    message.textContent =
                        "Email sent successfully! The administrator has been notified.";

                    message.style.color = "#047857";
                    message.style.display = "block";

                    button.textContent = "Notification Sent";

                } catch (error) {

                    console.error(
                        "Admin notification error:",
                        error
                    );

                    message.textContent =
                        error.message || "Could not send email. Please try again.";

                    message.style.color = "#b91c1c";
                    message.style.display = "block";

                    button.disabled = false;

                    button.textContent =
                        "Notify Admin — I'm Waiting";
                }
            }
        );


        // Handle login
        document.getElementById("loginForm").addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const email = document.getElementById("email").value.trim();

                const password = document.getElementById("password").value;

                const button = document.getElementById("loginButton");

                const errorBox = document.getElementById("errorMessage");

                // Reset previous messages
                errorBox.style.display = "none";

                document.getElementById(
                    "pendingApprovalSection"
                ).style.display = "none";

                const notificationMessage = document.getElementById(
                    "notificationMessage"
                );

                notificationMessage.style.display = "none";

                const notifyButton = document.getElementById(
                    "notifyAdminButton"
                );

                notifyButton.disabled = false;

                notifyButton.textContent = "Notify Admin — I'm Waiting";


                button.disabled = true;
                button.textContent = "Signing in...";

                try {

                    // Step 1: Authenticate with Firebase
                    const result = await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );

                    // Step 2: Get Firebase ID token
                    const idToken = await result.user.getIdToken();

                    // Step 3: Get Django CSRF token
                    const csrfToken =
                        getCookie("csrftoken") ||
                        document.querySelector(
                            'input[name="csrfmiddlewaretoken"]'
                        )?.value ||
                        "";

                    if (!csrfToken) {
                        throw new Error(
                            "Security token is missing. Please refresh the page and try again."
                        );
                    }

                    // Step 4: Send token to Django
                    const response = await fetch(
                        "/tutor_panel/firebase-login/",
                        {
                            method: "POST",

                            credentials: "same-origin",

                            headers: {
                                "Content-Type": "application/json",
                                "X-CSRFToken": csrfToken
                            },

                            body: JSON.stringify({
                                idToken: idToken
                            })
                        }
                    );

                    // Step 5: Read Django response
                    const data = await response.json();

                    if (!response.ok || !data.success) {

                        const errorMessage = data.error || "Login failed.";

                        // Show notification option for pending accounts
                        if (
                            errorMessage.toLowerCase().includes("pending")
                        ) {

                            showError(errorMessage);
                            showPendingApproval();

                            // Keep the Firebase user authenticated so the
                            // notification button can retrieve their token.
                            return;
                        }

                        throw new Error(errorMessage);
                    }

                    // Step 6: Redirect after successful login
                    if (data.redirect_url) {

                        window.location.href = data.redirect_url;

                    } else {

                        throw new Error(
                            "Login succeeded, but the redirect address is missing."
                        );
                    }

                } catch (error) {

                    console.error("Tutorain login error:", error);

                    let message = error.message || "Login failed.";

                    if (
                        error.code === "auth/invalid-credential" ||
                        error.code === "auth/wrong-password" ||
                        error.code === "auth/user-not-found"
                    ) {

                        message =
                            "Invalid email or password. Please check your credentials.";

                    } else if (
                        error.code === "auth/too-many-requests"
                    ) {

                        message =
                            "Too many login attempts. Please wait and try again.";

                    } else if (
                        error.code === "auth/network-request-failed"
                    ) {

                        message =
                            "Network error. Please check your internet connection.";
                    }

                    showError(message);

                } finally {

                    button.disabled = false;
                    button.textContent = "Sign In";
                }
            }
        );

    </script>

</body>

</html>
