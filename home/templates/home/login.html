{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Login - Tutorain</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS (IMPORTANT for navbar) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            min-height: 100vh;
        }

        .login-wrapper{
            display:flex;
            align-items:center;
            justify-content:center;
            height: calc(100vh - 80px);
        }

        .login-container {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 350px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .logo {
            text-align: center;
            font-size: 22px;
            font-weight: 600;
            color: #2a5298;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            font-size: 14px;
            color: #777;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 10px;
            border: 1px solid #ddd;
            font-size: 14px;
        }

        .password-box {
            position: relative;
        }

        .toggle-eye {
            position: absolute;
            right: 12px;
            top: 12px;
            cursor: pointer;
            font-size: 14px;
            color: #555;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #2a5298, #1e3c72);
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .options {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .error {
            color: red;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
        }

        /* navbar fix */
        header {
            background: white;
        }
    </style>
</head>

<body>

<!-- HEADER START -->
<header>
<div class="container">
  <div class="row align-items-center py-2">
    <div class="col-6 col-lg-3">
      <a class="navbar-brand" href="{% url 'home' %}">
        <img src="{% static 'website/img/logo/logo1.png' %}" alt="Tutorain" style="height: 45px;">
      </a>
    </div>

    <div class="col-6 col-lg-9">
      <nav class="navbar navbar-expand-lg navbar-light p-0">

        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#mainNavbar">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-end" id="mainNavbar">
          <ul class="navbar-nav">

            <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'findsub' %}">Find Tutor</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'contact' %}">Contact Us</a></li>

            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" data-toggle="dropdown">More</a>
              <div class="dropdown-menu">
                <a class="dropdown-item" href="{% url 'maca' %}">MACA</a>
                <a class="dropdown-item" href="{% url 'comingsoon' %}">MAAI</a>
                <a class="dropdown-item" href="{% url 'comingsoon' %}">Feedback</a>
              </div>
            </li>

            <li class="nav-item">
              <a class="btn btn-outline-primary btn-sm m-1" href="{% url 'findsub' %}">Join Tutorain</a>
            </li>

            <li class="nav-item">
              <a class="btn btn-outline-primary btn-sm m-1" href="{% url 'login' %}">Login</a>
            </li>

          </ul>
        </div>

      </nav>
    </div>
  </div>
</div>
</header>
<!-- HEADER END -->


<!-- LOGIN -->
<div class="login-wrapper">

<div class="login-container">

    <div class="logo">Tutorain</div>
    <div class="subtitle">Learn Smart • Learn Anywhere</div>

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="mobile" id="mobile" placeholder="📱 Mobile Number" required>

        <div class="password-box">
            <input type="password" name="password" id="password" placeholder="🔒 Password" required>
            <span class="toggle-eye" onclick="togglePassword()">👁️‍🗨️</span>
        </div>

        <div class="options">
            <label>
                <input type="checkbox" id="remember"> Remember Me
            </label>
        </div>

        <button type="submit">Login</button>
    </form>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

</div>

</div>

<!-- JS -->
<script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
function togglePassword() {
    const pass = document.getElementById("password");
    pass.type = pass.type === "password" ? "text" : "password";
}

const mobileInput = document.getElementById("mobile");
const rememberCheck = document.getElementById("remember");

window.onload = function() {
    const savedMobile = localStorage.getItem("mobile");
    if (savedMobile) {
        mobileInput.value = savedMobile;
        rememberCheck.checked = true;
    }
};

document.querySelector("form").addEventListener("submit", function() {
    if (rememberCheck.checked) {
        localStorage.setItem("mobile", mobileInput.value);
    } else {
        localStorage.removeItem("mobile");
    }
});
</script>

</body>
</html>
